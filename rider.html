<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rider Panel – Logic Laundry Services</title>
<style>
  :root{--blue:#0B4FA8;--blue-deep:#083a80;--gold:#F6B51B;--ink:#122548;--line:#e3e0d3}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f4f6fb;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
  .card{background:#fff;border-radius:16px;box-shadow:0 12px 30px -12px rgba(11,79,168,.25);padding:28px 24px;max-width:420px;width:100%}
  h1{font-size:1.3rem;margin-bottom:4px}
  p.sub{color:#556;font-size:.9rem;margin-bottom:20px}
  label{display:block;font-size:.85rem;font-weight:700;margin:14px 0 6px}
  input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:10px;font-size:1rem}
  input:focus{outline:none;border-color:var(--blue)}
  button{width:100%;padding:14px;border:none;border-radius:999px;font-weight:700;font-size:1rem;margin-top:14px;cursor:pointer}
  .btn-start{background:var(--blue);color:#fff}
  .btn-start:disabled{background:#9db6d9;cursor:not-allowed}
  .btn-stop{background:#e5493f;color:#fff}
  .status-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .status-btn{background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 6px;font-size:.82rem;font-weight:700;color:var(--ink)}
  .status-btn.active{background:var(--gold);border-color:var(--gold);color:#3a2a00}
  #liveState{margin-top:18px;font-size:.85rem;padding:12px;border-radius:10px;background:#eef4ff;color:var(--blue-deep);font-weight:600;text-align:center}
  #liveState.sharing{background:#e8fbf1;color:#0f7a45}
  #liveState.error{background:#fdecec;color:#b3261e}
  .coords{font-size:.75rem;color:#667;margin-top:8px;text-align:center}
  #gateCard label{margin-top:0}
</style>
</head>
<body>
  <div class="card" id="gateCard">
    <h1>🔒 Rider Access</h1>
    <p class="sub">Enter the rider password to continue.</p>
    <label for="gatePassword">Password</label>
    <input id="gatePassword" type="password" placeholder="Enter password">
    <button id="gateBtn" class="btn-start">Unlock</button>
    <div id="gateError" style="display:none;margin-top:12px;padding:10px;border-radius:10px;background:#fdecec;color:#b3261e;font-size:.85rem;text-align:center">Incorrect password. Try again.</div>
  </div>

  <div class="card" id="riderCard" style="display:none">
    <h1>🚴 Rider Panel</h1>
    <p class="sub">Enter the order number, then start sharing your location. Keep this page open while you're moving.</p>

    <label for="orderId">Order Number</label>
    <input id="orderId" placeholder="e.g. LL-1023" autocapitalize="characters">

    <button id="startBtn" class="btn-start">Start Sharing Location</button>
    <button id="stopBtn" class="btn-stop" style="display:none">Stop Sharing</button>

    <div class="status-grid">
      <button class="status-btn" data-status="placed">📦 Order Placed</button>
      <button class="status-btn" data-status="pickup">🚴 Pickup En Route</button>
      <button class="status-btn" data-status="washing">🫧 Being Washed</button>
      <button class="status-btn" data-status="ready">👕 Ready</button>
      <button class="status-btn" data-status="delivered" style="grid-column:1/3">🏠 Delivered</button>
    </div>

    <div id="liveState">Not sharing yet</div>
    <div class="coords" id="coords"></div>
  </div>

  <script>
    // ============================================================
    // To change the rider password, edit the line below.
    // ============================================================
    const RIDER_PASSWORD = "logic2026";

    const gateCard = document.getElementById('gateCard');
    const riderCard = document.getElementById('riderCard');
    const gateBtn = document.getElementById('gateBtn');
    const gatePassword = document.getElementById('gatePassword');
    const gateError = document.getElementById('gateError');

    function unlock(){
      gateCard.style.display = 'none';
      riderCard.style.display = 'block';
      sessionStorage.setItem('riderUnlocked', '1');
    }

    if(sessionStorage.getItem('riderUnlocked') === '1'){
      unlock();
    }

    gateBtn.addEventListener('click', () => {
      if(gatePassword.value === RIDER_PASSWORD){
        unlock();
      } else {
        gateError.style.display = 'block';
      }
    });
    gatePassword.addEventListener('keydown', (e) => {
      if(e.key === 'Enter') gateBtn.click();
    });
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let watchId = null;
    let currentOrder = null;

    const orderIdInput = document.getElementById('orderId');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const liveState = document.getElementById('liveState');
    const coordsEl = document.getElementById('coords');

    function setState(text, cls){
      liveState.textContent = text;
      liveState.className = cls || '';
    }

    startBtn.addEventListener('click', () => {
      const id = orderIdInput.value.trim().toUpperCase();
      if(!id){ alert('Enter the order number first.'); return; }
      if(!navigator.geolocation){ setState('Your browser does not support location sharing.', 'error'); return; }

      currentOrder = id;
      orderIdInput.disabled = true;
      startBtn.style.display = 'none';
      stopBtn.style.display = 'block';
      setState('Getting your location…');

      watchId = navigator.geolocation.watchPosition(async (pos) => {
        const { latitude, longitude } = pos.coords;
        try {
          await setDoc(doc(db, 'orders', currentOrder), {
            lat: latitude,
            lng: longitude,
            lastLocationAt: serverTimestamp()
          }, { merge: true });
          setState('🟢 Sharing live location', 'sharing');
          coordsEl.textContent = `Lat ${latitude.toFixed(5)}, Lng ${longitude.toFixed(5)}`;
        } catch (e) {
          setState('Could not save location: ' + e.message, 'error');
        }
      }, (err) => {
        setState('Location error: ' + err.message, 'error');
      }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
    });

    stopBtn.addEventListener('click', () => {
      if(watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = null;
      orderIdInput.disabled = false;
      startBtn.style.display = 'block';
      stopBtn.style.display = 'none';
      setState('Stopped sharing');
    });

    document.querySelectorAll('.status-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = orderIdInput.value.trim().toUpperCase();
        if(!id){ alert('Enter the order number first.'); return; }
        try {
          await setDoc(doc(db, 'orders', id), {
            status: btn.dataset.status,
            statusUpdatedAt: serverTimestamp()
          }, { merge: true });
          document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        } catch (e) {
          alert('Could not update status: ' + e.message);
        }
      });
    });
  </script>
</body>
</html>
